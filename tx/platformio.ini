; Transmitter (worn/mounted button). Seeed XIAO ESP32-S3.
[env:seeed_xiao_esp32s3]
; pioarduino fork, pinned to Arduino-ESP32 core 3.3.9 / ESP-IDF 5.5.4.
; The OFFICIAL "espressif32" platform is stuck on core 2.x and will NOT
; compile the ESP-NOW callback signatures used here (esp_now_recv_info_t /
; wifi_tx_info_t). Those two signatures only line up together on core >= 3.3.0,
; which is why we pin an exact release rather than "target 3.x" loosely.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; XIAO S3 uses native USB (no CP2102). Route Serial over USB-CDC so the monitor
; works. Note: the CDC port disappears while the board deep-sleeps — diagnose
; from the RX serial, not this port (see HANDOFF.md §4).
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
