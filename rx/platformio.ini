; Receiver (mains-powered alarm). ESP32-WROOM dev board.
[env:esp32dev]
; pioarduino fork, pinned to Arduino-ESP32 core 3.3.9 / ESP-IDF 5.5.4.
; Must match the TX project: the ESP-NOW callbacks here require core >= 3.3.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
